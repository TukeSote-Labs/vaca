[package]
name = "vaca"
version = "0.1.0"
edition = "2021"
description = "Vaca: lenguaje de programación en español, orientado a servidores"
license = "MIT"

[[bin]]
name = "vaca"
path = "src/main.rs"

[lib]
name = "vaca"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = "thin"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
