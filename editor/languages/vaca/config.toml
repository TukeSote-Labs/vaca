name = "Vaca"
grammar = "vaca"
path_suffixes = ["vaca"]
line_comments = ["# ", "// "]
block_comment = { start = "/*", end = "*/", prefix = "* ", tab_size = 1 }
autoclose_before = ";:.,=}])>"
tab_size = 4
word_characters = ["_"]

brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = false },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["comment", "string"] },
]
